<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroMega | Celulares, Accesorios y Electrodomésticos</title>

  <!-- Conexión con CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Tipografía moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icono del sitio -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1041/1041916.png" type="image/png">
</head>

<body>
  <!-- ===================== CABECERA ===================== -->
  <header class="header-superior">

    <div class="barra-superior">

      <!-- LOGO -->
      <div class="logo">
        <img src="logo/electromega.jpeg" alt="ElectroMega Logo">
      </div>

      <!-- BARRA DE BÚSQUEDA -->
      <div class="contenedor-busqueda">
        <input type="text" id="buscador" placeholder="Buscar por marca o referencia">
        <button class="btn-buscar" id="btnBuscar" type="button">
          <img src="icons/buscar.png" alt="Buscar">
        </button>
      </div>

      <!-- BOTÓN MENÚ MÓVIL -->
      <button class="btn-menu-movil" id="btn-menu-movil" type="button" aria-expanded="false" aria-controls="menu-categorias">
        <span></span><span></span><span></span>
      </button>

    </div>

    <!-- MENÚ DE CATEGORÍAS -->
    <nav class="menu-categorias" id="menu-categorias" aria-label="Categorías de productos">
      <button type="button" class="activo" data-categoria="celulares" aria-current="page">Celulares</button>
      <button type="button" data-categoria="accesorios">Accesorios</button>
      <button type="button" data-categoria="electrodomesticos">Electrodomésticos</button>
    </nav>

    <!-- BANNER PRINCIPAL -->
    <div class="banner-principal">
      <img src="logo/banner.png" alt="Banner ElectroMega" loading="eager" fetchpriority="high">
    </div>

  </header>


  <!-- ===================== CATÁLOGO ===================== -->
  <main>
    <section class="catalogo" id="catalogo">
      <h2 class="titulo-seccion" id="titulo-seccion">Catálogo de Celulares</h2>
      <p class="subtitulo" id="subtitulo-seccion">Explora nuestra selección de las mejores marcas del mercado</p>

      <div class="grid-productos" id="grid-productos"></div>

      <!-- ESTADO VACÍO (categoría sin productos aún, o búsqueda sin resultados) -->
      <div class="estado-vacio" id="estado-vacio" hidden>
        <img src="icons/buscar.png" alt="" class="estado-vacio-icono">
        <p id="mensaje-vacio">Aún no hay productos cargados en esta categoría.</p>
      </div>

    </section>
  </main>

  <!-- ===================== PIE DE PÁGINA ===================== -->
  <footer class="pie-pagina">
    <p>© 2025 ElectroMega — Todos los derechos reservados</p>
  </footer>

  <!-- ===================== PLANTILLA DE TARJETA DE PRODUCTO =====================
       El JS clona esto por cada producto; así el HTML no tiene que repetirse
       para cada celular, accesorio o electrodoméstico. -->
  <template id="plantilla-producto">
    <article class="producto">
      <figure class="imagen-producto">
        <img src="" alt="">
      </figure>
      <div class="info-producto">
        <h3 class="marca"></h3>
        <h4 class="modelo"></h4>
        <ul class="caracteristicas"></ul>
        <p class="precio"></p>
      </div>
    </article>
  </template>

  <!-- Conexión con el JavaScript -->
  <script src="script.js" defer></script>
</body>
</html>
